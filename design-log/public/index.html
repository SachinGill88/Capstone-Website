<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design Log</title>
<script src="vendor/marked.min.js"></script>
<script src="vendor/purify.min.js"></script>
<style>
:root{--bg:#f7f7f5;--card:#fff;--ink:#1c1c1a;--muted:#6b6b66;--line:#e4e4df;--accent:#2f5fd8;--danger:#b3261e;
  --m0:#2f5fd8;--m1:#c8541f;--m2:#1f8a5c;--m3:#8a3fb0;--m4:#b08a1f;--m5:#1f7f8a;}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--card:#1f1f1d;--ink:#ecece8;--muted:#a0a09a;--line:#33332f;--accent:#7ea0ff;--danger:#ff8a80;}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
a{color:var(--accent)}
.wrap{max-width:1100px;margin:0 auto;padding:24px 16px 64px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:20px}
.top h1{margin:0 0 4px;font-size:1.6rem}
.top p{margin:0;color:var(--muted)}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{font:inherit;cursor:pointer}
.btn{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--danger)}
.btn.small{padding:4px 10px;font-size:.85rem}
.btn:disabled{opacity:.6;cursor:default}
.layout{display:grid;grid-template-columns:240px 1fr;gap:28px}
@media (max-width:760px){.layout{grid-template-columns:1fr}aside{position:static}}
aside{position:sticky;top:16px;align-self:start}
aside h3{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
aside h3:first-child{margin-top:0}
.filter{display:flex;width:100%;align-items:center;gap:8px;background:none;border:1px solid transparent;border-radius:8px;padding:6px 8px;color:var(--ink);text-align:left}
.filter:hover{background:var(--card)}
.filter.active{background:var(--card);border-color:var(--line)}
.filter .count{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.avatar{width:32px;height:32px;border-radius:50%;color:#fff;display:grid;place-items:center;font-weight:600;flex:none}
.avatars{display:flex;flex:none}
.avatars .avatar{margin-left:-8px;border:2px solid var(--card)}
.avatars .avatar:first-child{margin-left:0}
.m0{background:var(--m0)}.m1{background:var(--m1)}.m2{background:var(--m2)}.m3{background:var(--m3)}.m4{background:var(--m4)}.m5{background:var(--m5)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:14px}
.entry header{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.head-text{flex:1;min-width:180px}
.byline{color:var(--muted)}
.byline strong{color:var(--ink)}
.byline time{margin-left:8px}
.entry h2{margin:2px 0 0;font-size:1.1rem}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:.75rem;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);text-transform:capitalize}
.body{margin-top:10px;overflow-wrap:anywhere}
.body p:first-child{margin-top:0}.body p:last-child{margin-bottom:0}
.body pre{overflow-x:auto;background:var(--bg);padding:10px;border-radius:8px}
.body table{border-collapse:collapse}.body td,.body th{border:1px solid var(--line);padding:4px 8px}
.gallery{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.gallery a{display:block}
.gallery img{height:140px;max-width:100%;border-radius:8px;border:1px solid var(--line);object-fit:cover}
.foot{display:flex;gap:10px;align-items:center;margin-top:12px;color:var(--muted);font-size:.85rem;flex-wrap:wrap}
.foot .spacer{flex:1}
.foot button.link{background:none;border:none;color:var(--muted);padding:0;text-decoration:underline}
.empty{color:var(--muted);padding:24px;text-align:center}
.hide{display:none!important}
.total{color:var(--muted);font-size:.9rem;margin-bottom:12px}
/* form */
.form label{display:block;font-size:.85rem;color:var(--muted);margin:10px 0 4px}
.form input[type=text],.form input[type=date],.form select,.form textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.form textarea{min-height:160px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.9rem}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.row{grid-template-columns:1fr}}
.checks{display:flex;gap:10px;flex-wrap:wrap}
.checks label{display:inline-flex;align-items:center;gap:4px;margin:0;border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--ink);text-transform:capitalize;cursor:pointer}
.checks input{margin:0}
.previews{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.previews figure{margin:0;position:relative}
.previews img{height:90px;border-radius:8px;border:1px solid var(--line);object-fit:cover}
.previews button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:none;background:var(--ink);color:var(--bg);font-size:12px;line-height:22px;padding:0}
.form .bar{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap}
.form .msg{color:var(--danger);font-size:.9rem}
.hint{font-size:.8rem;color:var(--muted)}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px;z-index:10}
.modal .card{width:min(720px,100%);max-height:90vh;overflow:auto;margin:0}
.version{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.version:first-of-type{border-top:none;margin-top:0;padding-top:0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.9rem;z-index:20}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1 id="title">Design Log</h1><p id="subtitle"></p></div>
    <div class="actions">
      <span class="hint" id="who"></span>
      <button class="btn" id="unlockBtn">Unlock to post</button>
      <button class="btn primary hide" id="newBtn">+ New entry</button>
      <button class="btn small hide" id="lockBtn">Lock</button>
    </div>
  </div>
  <div class="layout">
    <aside>
      <h3>Members</h3>
      <div id="memberFilters"></div>
      <h3>Phase</h3>
      <div id="tagFilters"></div>
    </aside>
    <main>
      <div class="card form hide" id="formCard"></div>
      <div class="total" id="total">Loading…</div>
      <div id="list"></div>
      <p class="empty hide" id="none">No entries match this filter.</p>
    </main>
  </div>
</div>
<div id="modalHost"></div>

<script>
(function () {
  "use strict";
  const $ = (s, el = document) => el.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const PASS_KEY = "designlog.passcode", NAME_KEY = "designlog.name", MEMBERS_KEY = "designlog.members";

  let config = { title: "Design Log", subtitle: "", members: [], tags: [] };
  let entries = [];
  let filterMember = "", filterTag = "";
  let passcode = "";
  try { passcode = localStorage.getItem(PASS_KEY) || ""; } catch {}

  const memberIndex = (n) => { const i = config.members.indexOf(n); return (i < 0 ? config.members.length : i) % 6; };
  // Older entries only have `name`; newer ones list everyone who worked on it in `members`.
  const membersOf = (e) => (Array.isArray(e?.members) && e.members.length ? e.members : [e?.name].filter(Boolean));
  const fmtDate = (d) => { const [y, m, day] = d.split("-").map(Number); return new Date(Date.UTC(y, m - 1, day)).toLocaleDateString("en-CA", { year: "numeric", month: "short", day: "numeric", timeZone: "UTC" }); };
  const todayISO = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
  const render = (md) => DOMPurify.sanitize(marked.parse(md || "", { breaks: true }), { USE_PROFILES: { html: true } });
  const unlocked = () => !!passcode;

  function toast(msg, ms = 2200) {
    const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
    document.body.appendChild(t); setTimeout(() => t.remove(), ms);
  }

  async function api(method, path, body, headers = {}) {
    const h = { ...headers };
    if (passcode) h["x-passcode"] = passcode;
    if (body && !(body instanceof Blob)) { h["content-type"] = "application/json"; body = JSON.stringify(body); }
    const r = await fetch(path, { method, headers: h, body });
    if (r.status === 204) return null;
    const data = await r.json().catch(() => ({}));
    if (!r.ok) {
      if (r.status === 401 && passcode) { setPasscode(""); }
      throw new Error(data.error || `Request failed (${r.status})`);
    }
    return data;
  }

  function setPasscode(p) {
    passcode = p;
    try { p ? localStorage.setItem(PASS_KEY, p) : localStorage.removeItem(PASS_KEY); } catch {}
    renderAuth();
  }

  // ---------- header / auth ----------
  function renderAuth() {
    $("#unlockBtn").classList.toggle("hide", unlocked());
    $("#newBtn").classList.toggle("hide", !unlocked());
    $("#lockBtn").classList.toggle("hide", !unlocked());
    $("#who").textContent = unlocked() ? "Posting enabled" : "";
    document.querySelectorAll(".owner-only").forEach((el) => el.classList.toggle("hide", !unlocked()));
  }
  $("#unlockBtn").addEventListener("click", async () => {
    const p = prompt("Team passcode:");
    if (p == null) return;
    const trial = p.trim();
    try {
      const r = await fetch("/api/auth", { method: "POST", headers: { "x-passcode": trial } });
      if (!r.ok) { toast("Wrong passcode"); return; }
      setPasscode(trial); toast("Unlocked");
    } catch { toast("Could not reach the server"); }
  });
  $("#lockBtn").addEventListener("click", () => { setPasscode(""); closeForm(); });
  $("#newBtn").addEventListener("click", () => openForm(null));

  // ---------- filters ----------
  function renderFilters() {
    const tally = Object.fromEntries(config.members.map((m) => [m, 0]));
    for (const e of entries) for (const m of membersOf(e)) tally[m] = (tally[m] || 0) + 1;
    const names = [...config.members, ...Object.keys(tally).filter((n) => !config.members.includes(n))];
    $("#memberFilters").innerHTML =
      `<button class="filter ${!filterMember ? "active" : ""}" data-member="">All <span class="count">${entries.length}</span></button>` +
      names.map((m) => `<button class="filter ${filterMember === m ? "active" : ""}" data-member="${esc(m)}"><span class="dot m${memberIndex(m)}"></span>${esc(m)} <span class="count">${tally[m] || 0}</span></button>`).join("");
    const tags = [...new Set([...config.tags, ...entries.flatMap((e) => e.tags || [])])];
    const tagCount = (t) => entries.filter((e) => (e.tags || []).includes(t)).length;
    $("#tagFilters").innerHTML =
      `<button class="filter ${!filterTag ? "active" : ""}" data-tag="">All</button>` +
      tags.map((t) => `<button class="filter ${filterTag === t ? "active" : ""}" data-tag="${esc(t)}">${esc(t)} <span class="count">${tagCount(t)}</span></button>`).join("");
    document.querySelectorAll("[data-member]").forEach((b) => b.addEventListener("click", () => { filterMember = b.dataset.member; renderAll(); }));
    document.querySelectorAll("[data-tag]").forEach((b) => b.addEventListener("click", () => { filterTag = b.dataset.tag; renderAll(); }));
  }

  // ---------- list ----------
  function entryCard(e) {
    const imgs = (e.images || []).map((id) => `<a href="/api/images/${esc(id)}" target="_blank" rel="noopener"><img src="/api/images/${esc(id)}" alt="attachment" loading="lazy"></a>`).join("");
    const edited = e.edits > 0 ? `<button class="link" data-history="${esc(e.id)}">edited ${e.edits}× · view history</button>` : "";
    return `<article class="card entry" data-id="${esc(e.id)}">
      <header>
        <span class="avatars">${membersOf(e).map((m) => `<span class="avatar m${memberIndex(m)}" title="${esc(m)}">${esc(m[0])}</span>`).join("")}</span>
        <div class="head-text">
          <div class="byline"><strong>${esc(membersOf(e).join(", "))}</strong> <time datetime="${esc(e.date)}">${fmtDate(e.date)}</time></div>
          ${e.title ? `<h2>${esc(e.title)}</h2>` : ""}
        </div>
        ${(e.tags || []).length ? `<div class="tags">${e.tags.map((t) => `<span class="tag">${esc(t)}</span>`).join("")}</div>` : ""}
      </header>
      ${e.body ? `<div class="body">${render(e.body)}</div>` : ""}
      ${imgs ? `<div class="gallery">${imgs}</div>` : ""}
      <div class="foot">
        <span>posted ${new Date(e.createdAt).toLocaleString("en-CA")}</span>
        ${edited}
        <span class="spacer"></span>
        <span class="owner-only ${unlocked() ? "" : "hide"}"><button class="btn small" data-edit="${esc(e.id)}">Edit</button> <button class="btn small danger" data-delete="${esc(e.id)}">Delete</button></span>
      </div>
    </article>`;
  }

  function renderList() {
    const shown = entries.filter((e) => (!filterMember || membersOf(e).includes(filterMember)) && (!filterTag || (e.tags || []).includes(filterTag)));
    $("#list").innerHTML = shown.map(entryCard).join("");
    $("#none").classList.toggle("hide", shown.length !== 0 || entries.length === 0);
    $("#total").textContent = entries.length === 0 ? "No entries yet." :
      `${shown.length} entr${shown.length === 1 ? "y" : "ies"}${filterMember ? " by " + filterMember : ""}${filterTag ? " tagged " + filterTag : ""}`;
    const q = new URLSearchParams(); if (filterMember) q.set("member", filterMember); if (filterTag) q.set("tag", filterTag);
    history.replaceState(null, "", q.toString() ? "?" + q : location.pathname);
    document.querySelectorAll("[data-edit]").forEach((b) => b.addEventListener("click", () => openForm(entries.find((e) => e.id === b.dataset.edit))));
    document.querySelectorAll("[data-delete]").forEach((b) => b.addEventListener("click", () => removeEntry(b.dataset.delete)));
    document.querySelectorAll("[data-history]").forEach((b) => b.addEventListener("click", () => showHistory(b.dataset.history)));
  }

  function renderAll() { renderFilters(); renderList(); renderAuth(); }

  async function load() {
    try {
      entries = await api("GET", "/api/entries");
    } catch (err) { $("#total").textContent = "Could not load entries: " + err.message; return; }
    renderAll();
  }

  // ---------- form ----------
  let pendingImages = []; // [{id}] already uploaded for this draft
  let editing = null;

  function openForm(entry) {
    editing = entry;
    pendingImages = (entry?.images || []).map((id) => ({ id }));
    let lastMembers = [];
    try { lastMembers = JSON.parse(localStorage.getItem(MEMBERS_KEY) || "null") || [localStorage.getItem(NAME_KEY)].filter(Boolean); } catch {}
    const members = new Set(entry ? membersOf(entry) : (lastMembers.length ? lastMembers : config.members.slice(0, 1)));
    const allMembers = [...new Set([...config.members, ...members])];
    const tags = new Set(entry?.tags || []);
    const allTags = [...new Set([...config.tags, ...tags])];
    $("#formCard").innerHTML = `
      <h2 style="margin:0 0 4px;font-size:1.1rem">${entry ? "Edit entry" : "New entry"}</h2>
      <label>Members <span class="hint">(tick everyone who worked on this)</span></label>
      <div class="checks" id="fMembers">${allMembers.map((m) => `<label><input type="checkbox" value="${esc(m)}" ${members.has(m) ? "checked" : ""}>${esc(m)}</label>`).join("")}</div>
      <div class="row">
        <div><label>Date</label><input type="date" id="fDate" value="${esc(entry?.date || todayISO())}"></div>
      </div>
      <label>Title</label><input type="text" id="fTitle" placeholder="What did you work on?" value="${esc(entry?.title || "")}">
      <label>Phase</label>
      <div class="checks" id="fTags">${allTags.map((t) => `<label><input type="checkbox" value="${esc(t)}" ${tags.has(t) ? "checked" : ""}>${esc(t)}</label>`).join("")}</div>
      <label>Entry <span class="hint">(Markdown works: **bold**, - lists, | tables |, links)</span></label>
      <textarea id="fBody" placeholder="What you did, why, what you found, what's next.">${esc(entry?.body || "")}</textarea>
      <label>Photos <span class="hint">(sketches, CAD, test rigs — resized automatically)</span></label>
      <input type="file" id="fFiles" accept="image/*" multiple>
      <div class="previews" id="fPreviews"></div>
      <div class="bar">
        <button class="btn primary" id="fSave">${entry ? "Save changes" : "Post entry"}</button>
        <button class="btn" id="fCancel">Cancel</button>
        <span class="msg" id="fMsg"></span>
      </div>`;
    $("#formCard").classList.remove("hide");
    renderPreviews();
    $("#fFiles").addEventListener("change", onFiles);
    $("#fSave").addEventListener("click", save);
    $("#fCancel").addEventListener("click", closeForm);
    window.scrollTo({ top: 0, behavior: "smooth" });
    $("#fTitle").focus();
  }
  function closeForm() { $("#formCard").classList.add("hide"); $("#formCard").innerHTML = ""; editing = null; pendingImages = []; }

  function renderPreviews() {
    $("#fPreviews").innerHTML = pendingImages.map((im, i) =>
      `<figure><img src="/api/images/${esc(im.id)}" alt=""><button type="button" data-rm="${i}" title="Remove">×</button></figure>`).join("");
    document.querySelectorAll("[data-rm]").forEach((b) => b.addEventListener("click", () => { pendingImages.splice(+b.dataset.rm, 1); renderPreviews(); }));
  }

  // Downscale on the client so phone photos upload quickly and stay under the 5 MB limit.
  function shrink(file, max = 1600, quality = 0.85) {
    return new Promise((resolve) => {
      if (file.type === "image/gif") return resolve(file);
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        URL.revokeObjectURL(url);
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        if (scale === 1 && file.size < 1.5 * 1024 * 1024) return resolve(file);
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        c.toBlob((b) => resolve(b || file), file.type === "image/png" ? "image/png" : "image/jpeg", quality);
      };
      img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
      img.src = url;
    });
  }

  async function onFiles(ev) {
    const files = [...ev.target.files]; ev.target.value = "";
    const msg = $("#fMsg"); msg.textContent = "";
    $("#fSave").disabled = true;
    for (const f of files) {
      try {
        const blob = await shrink(f);
        const r = await api("POST", "/api/images", blob, { "content-type": blob.type || f.type });
        pendingImages.push({ id: r.id }); renderPreviews();
      } catch (err) { msg.textContent = `${f.name}: ${err.message}`; }
    }
    $("#fSave").disabled = false;
  }

  async function save() {
    const members = [...document.querySelectorAll("#fMembers input:checked")].map((c) => c.value);
    const msg = $("#fMsg"); msg.textContent = "";
    if (!members.length) { msg.textContent = "Tick at least one member"; return; }
    const payload = {
      name: members[0], members, date: $("#fDate").value, title: $("#fTitle").value,
      tags: [...document.querySelectorAll("#fTags input:checked")].map((c) => c.value),
      body: $("#fBody").value, images: pendingImages.map((i) => i.id),
    };
    $("#fSave").disabled = true;
    try {
      if (editing) await api("PUT", `/api/entries/${editing.id}`, payload);
      else await api("POST", "/api/entries", payload);
      try { localStorage.setItem(MEMBERS_KEY, JSON.stringify(members)); localStorage.setItem(NAME_KEY, members[0]); } catch {}
      closeForm(); toast(editing ? "Saved" : "Posted"); await load();
    } catch (err) { msg.textContent = err.message; $("#fSave").disabled = false; }
  }

  async function removeEntry(id) {
    const e = entries.find((x) => x.id === id);
    if (!confirm(`Delete "${e?.title || "this entry"}" by ${membersOf(e).join(", ")}? This cannot be undone.`)) return;
    try { await api("DELETE", `/api/entries/${id}`); toast("Deleted"); await load(); }
    catch (err) { toast(err.message); }
  }

  // ---------- history ----------
  async function showHistory(id) {
    let full;
    try { full = await api("GET", `/api/entries/${id}`); } catch (err) { toast(err.message); return; }
    const versions = [...(full.history || [])].reverse();
    const host = $("#modalHost");
    host.innerHTML = `<div class="modal"><div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0;font-size:1.1rem">Edit history</h2><button class="btn small" id="mClose">Close</button></div>
      <p class="hint">Newest first. Current version is shown on the main page.</p>
      ${versions.map((v) => `<div class="version">
        <div class="byline"><strong>${esc(membersOf(v).join(", "))}</strong> <time>${fmtDate(v.date)}</time> · saved ${new Date(v.at).toLocaleString("en-CA")}</div>
        ${v.title ? `<h3 style="margin:4px 0;font-size:1rem">${esc(v.title)}</h3>` : ""}
        ${(v.tags || []).length ? `<div class="tags">${v.tags.map((t) => `<span class="tag">${esc(t)}</span>`).join("")}</div>` : ""}
        <div class="body">${render(v.body)}</div>
      </div>`).join("") || "<p class='hint'>No previous versions.</p>"}
    </div></div>`;
    const close = () => (host.innerHTML = "");
    $("#mClose").addEventListener("click", close);
    $(".modal").addEventListener("click", (ev) => { if (ev.target.classList.contains("modal")) close(); });
  }

  // ---------- boot ----------
  (async () => {
    try { config = { ...config, ...(await (await fetch("/config.json")).json()) }; } catch {}
    document.title = config.title; $("#title").textContent = config.title; $("#subtitle").textContent = config.subtitle;
    const q = new URLSearchParams(location.search);
    filterMember = q.get("member") || ""; filterTag = q.get("tag") || "";
    renderAuth();
    await load();
  })();
})();
</script>
</body>
</html>
